databases:
  - name: paperloop-db
    plan: free
    databaseName: paperloop
    user: paperloop

services:
  - type: web
    name: paperloop
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /accounts/login/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: paperloop.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://paperloop.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: paperloop-db
          property: connectionString
